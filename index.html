<!-- Music Button -->
<button id="musicBtn" class="music-btn">▶</button>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<style>
.music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: #27A89E;
    color: white;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(39,168,158,0.7);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 10px rgba(39,168,158,0.6); }
    50% { box-shadow: 0 0 25px rgba(39,168,158,1); }
    100% { box-shadow: 0 0 10px rgba(39,168,158,0.6); }
}

.music-btn:hover {
    transform: scale(1.1);
}
</style>

<script>
const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");

btn.addEventListener("click", function() {
    if (music.paused) {
        music.play();
        btn.innerHTML = "❚❚";
    } else {
        music.pause();
        btn.innerHTML = "▶";
    }
});
</script>
